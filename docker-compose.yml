services:
  postgres:
    image: postgres:16-alpine
    container_name: emotors-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emotors
    ports:
      - "5432:5432"
    volumes:
      - emotors-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emotors"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  emotors-postgres-data:
